# 1. 프로젝트 기본 설정
spring.application.name=Team_project
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 2. Database 설정 (Supabase PostgreSQL로 변경)
spring.datasource.driver-class-name=org.postgresql.Driver
# [본인-프로젝트-ID] 부분과 [본인-비밀번호]를 꼭 수정하세요!
spring.datasource.url=jdbc:postgresql://db.[본인-프로젝트-ID].supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=[본인-비밀번호]

# JPA/Hibernate 설정 (PostgreSQL용)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. View 설정 (JSP 사용 유지)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.jsp.init-parameters.development=true


mybatis.type-aliases-package=com.min.edu.dto
mybatis.mapper-locations=classpath:sql/*.xml

mybatis.configuration.map-underscore-to-camel-case=true

# DB 연결 상세 로그 출력
logging.level.org.hibernate.engine.jdbc.connections.internal.DatasourceConnectionProviderImpl=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=TRACE